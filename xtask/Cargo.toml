[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
stela-soc-data.workspace = true
stela-engine.workspace = true
stela-contracts = { path = "../crates/stela-contracts", default-features = false }
stela-formats = { path = "../crates/stela-formats", default-features = false }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
tempfile.workspace = true
stela-cli.workspace = true
stela-compiler.workspace = true
stela-drivers.workspace = true
stela-loader.workspace = true
stela-runtime.workspace = true
# The LAN peer's frames (`boot::lan::wire`).
smoltcp = { version = "0.14", default-features = false, features = ["medium-ethernet", "proto-ipv4"] }
object = { version = "0.37", features = ["read"] }
plist = "1"
quick-xml = "0.42"
sha1 = "0.10"
sha2.workspace = true
zip = { version = "4", default-features = false, features = ["deflate"] }
xz2 = { version = "0.1.7", features = ["static"] }

[build-dependencies]
object = { version = "0.37", features = ["read"] }

[features]
# The tests that read the NVIDIA hook layouts `cargo xtask gpu fetch` checks
# out; `cargo xtask check` turns it on.
fetched-sources = []

[lints]
workspace = true
