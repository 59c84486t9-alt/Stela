[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
tempfile.workspace = true
stela-cli.workspace = true
stela-compiler.workspace = true
stela-drivers.workspace = true
stela-loader.workspace = true
stela-runtime.workspace = true
# The LAN peer's frames (`boot::lan::wire`).
smoltcp = { version = "0.14", default-features = false, features = ["medium-ethernet", "proto-ipv4"] }
object = { version = "0.37", features = ["read"] }
plist = "1"
sha1 = "0.10"
sha2.workspace = true
zip = { version = "4", default-features = false, features = ["deflate"] }
xz2 = { version = "0.1.7", features = ["static"] }

[build-dependencies]
object = { version = "0.37", features = ["read"] }

[features]
# The tests that read the sources `cargo xtask gpu fetch` checks out: the
# boot IRQ resource decoder against the drivers' ACPI types (Linux ACPICA)
# and the NVIDIA hook layouts; `cargo xtask check` turns it on.
fetched-sources = ["stela-drivers/native-acpi"]

[dev-dependencies]
# Hosted tests of boot modules that use its topology and capture record.
stela-boot-core.workspace = true

[lints]
workspace = true
