[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
stela-core = { path = "crates/stela-core" }
stela-apple = { path = "crates/stela-apple" }
stela-macho = { path = "crates/stela-macho" }
stela-compiler = { path = "crates/stela-compiler" }
stela-runtime = { path = "crates/stela-runtime" }

[profile.release]
lto = "thin"
codegen-units = 1
