[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
tempfile = "3"
stela-core = { path = "crates/stela-core" }
stela-apple = { path = "crates/stela-apple" }
stela-macho = { path = "crates/stela-macho" }
stela-compiler = { path = "crates/stela-compiler" }
stela-runtime = { path = "crates/stela-runtime" }
stela-containers = { path = "crates/stela-containers" }

[profile.release]
lto = "thin"
codegen-units = 1

# Large restore images spend substantial time in these crates in debug builds.
# Keep Stela itself debuggable while using optimized hash compression code.
[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
