# Fast check of the installer and the release tooling: formatting, strict
# Clippy and tests. The full builds run in release.yml.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: check-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: check-

      - name: Install Rust
        run: |
          rustup toolchain install
          rustc --version
          clang --version | head -1

      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path crates/stela-boot/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --locked -p stela-cli -p xtask --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked -p stela-cli
