name: Rust and debug fixture
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 -m pip install -r dev/requirements-test.txt
      - run: python3 dev/differential.py
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 clang
      - run: python3 dev/vm.py smoke
      - run: |
          python3 -c 'import struct; from pathlib import Path; Path(".stela/leaf.arm64").write_bytes(struct.pack("<III",0xd2800500,0x91000800,0xd65f03c0))'
          cargo run --locked -p stela-cli -- compile-leaf .stela/leaf.arm64 --output-dir .stela/leaf-aot
          python3 dev/vm.py smoke --native .stela/leaf-aot/native.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-vm-evidence
          path: .stela/vm/
