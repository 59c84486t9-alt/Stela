[package]
name = "stela-boot"
version = "0.1.0"
edition = "2024"
license = "MIT AND GPL-2.0-only"
publish = false

[[bin]]
name = "stela"
path = "src/main.rs"

[workspace]

[dependencies]
uefi = { version = "0.41", default-features = false, features = ["alloc"] }
stela-drivers = { path = "../stela-drivers" }
stela-runtime = { path = "../stela-runtime", default-features = false }
stela-loader = { path = "../stela-loader", default-features = false }
stela-compiler = { path = "../stela-compiler", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# The soft-float UEFI target cannot codegen the optional hardware intrinsics in the local
# LLVM toolchain. Use the crate's real baseline SHA implementation.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

# LLVM cannot codegen the SHA-1 x86 intrinsics for the soft-float UEFI
# target. Unify this existing transitive dependency on its real software
# backend only for the boot target; hosted runtime keeps its normal selection.
[target.'cfg(target_os = "uefi")'.dependencies]
sha1 = { version = "0.10", default-features = false, features = ["force-soft"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
# Line tables go to the separate PDB, so profiles of a boot can name the
# engine's functions; the image itself is unchanged.
debug = "line-tables-only"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
