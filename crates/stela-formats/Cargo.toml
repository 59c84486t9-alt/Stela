[package]
name = "stela-formats"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
test-support = []
std = ["serde/std", "serde_json/std", "stela-contracts/std"]

[dependencies]
stela-crypto = { path = "../stela-crypto" }
stela-contracts = { path = "../stela-contracts", default-features = false }
serde.workspace = true
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# SHA-384 and SHA-512 for signatures and APFS; SHA-1/SHA-256 are stela-crypto's.
sha2 = { version = "0.10", default-features = false }
crypto-bigint = { version = "0.5", default-features = false }
# LocalPolicy signatures.
p384 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }

iri-string = { version = "=0.7.14", default-features = false, features = ["alloc"] }

[dev-dependencies]
lzfse_rust = "0.2"
# An independent SHA-1 for the CMS hash-agility fixtures.
sha1 = { version = "0.10", default-features = false }
