# Clang VFS overlay of Stela's shadows: each one replaces the upstream header
# named here wherever an unchanged source includes it, by any spelling. Each
# comment records the upstream header the shadow was written against;
# `cargo xtask gpu shadows` fails when upstream changes, and `--update` records
# the review. Headers outside this list may only add asm/, generated/ and
# Stela's own stela/ and unsupported.h.
version: 0
root-relative: overlay-dir
overlay-relative: true
roots: []
