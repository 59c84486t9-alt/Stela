[package]
name = "stela-drivers"
version.workspace = true
edition.workspace = true
# Original Stela code is MIT; Linux-derived controller code retains its
# GPL/ISC notices and the Intel shared initialization also retains BSD terms.
# GPU patches keep the terms of the upstream files they change.
license = "MIT AND BSD-3-Clause AND GPL-2.0-only AND GPL-2.0-or-later AND BSD-3-Clause-Clear AND ISC AND Apache-2.0 WITH LLVM-exception"

[lints]
workspace = true

[features]
# Native x86 ACPICA interpreter; builds freestanding C with clang.
native-acpi = ["dep:cc"]
# Common native Linux kernel services; selecting this attaches no GPU.
linux-kernel = ["dep:cc"]
# `block::RamDisk`, the in-memory disk the runtime's tests run models on.
ram-disk = []
# Build the implemented native NVIDIA OS hooks, not a complete GPU driver.
nvidia-port = ["dep:cc"]
# Native Xe command/page-table support; not an initialized Intel GPU driver.
intel-port = ["linux-kernel"]
# Native AMD page-entry and BAR support; requires real mapping/GMC owners.
amd-port = ["linux-kernel"]
# Hosted AMD encoder build; its C runtime is not yet ported to UEFI.
amd-commands = ["dep:cc"]
# Shared Metal library input validation, independent of a physical GPU backend.
metal = []

[dependencies]
# BIP-CMAC uses the shared checked AES backend; expanded keys clear on retirement.
aes = { version = "0.8", default-features = false, features = ["zeroize"] }
# WPA2-Personal: PBKDF2/PRF/MIC over HMAC-SHA1 and HMAC-SHA256.
hmac = { version = "0.12", default-features = false }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
# Cryptographic MIC comparison retains an explicit optimization barrier.
subtle = { version = "2.6", default-features = false }
# Retained source GTK/IGTK batch material must clear after actual retirement.
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# Fallible native mapping metadata; the maintained owner supports alloc-only UEFI.
triomphe = { version = "=0.1.16", default-features = false }

[build-dependencies]
# Reuse retained shared-input/object/digest versions; no new crate fetch.
libc = "0.2"
object = { version = "0.37", default-features = false, features = ["read"] }
sha2 = { version = "0.10", default-features = false }
cc = { version = "1", optional = true }

[[test]]
name = "nvidia_mmio"
required-features = ["nvidia-port"]

[[test]]
name = "amd_native_mmio"
required-features = ["amd-port"]

[[test]]
name = "intel_activation"
required-features = ["intel-port"]
