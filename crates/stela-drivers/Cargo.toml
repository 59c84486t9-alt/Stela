[package]
name = "stela-drivers"
version.workspace = true
edition.workspace = true
# Original Stela code is MIT; Linux-derived USB, Bluetooth and input code
# retains its GPL/ISC notices and the Intel shared initialization also retains
# BSD terms.
license = "MIT AND BSD-3-Clause AND GPL-2.0-only AND GPL-2.0-or-later AND ISC"

[lints]
workspace = true

[features]
native-acpi = ["stela-driver-base/native-acpi", "stela-driver-net/native-acpi"]
linux-kernel = ["stela-driver-gpu/linux-kernel"]
ram-disk = ["stela-driver-base/ram-disk"]
nvidia-port = ["stela-driver-gpu/nvidia-port"]
intel-port = ["stela-driver-gpu/intel-port"]
amd-port = ["stela-driver-gpu/amd-port"]
nouveau-port = ["stela-driver-gpu/nouveau-port"]
amd-commands = ["stela-driver-gpu/amd-commands"]
metal = ["stela-driver-gpu/metal"]
metal-vulkan = ["stela-driver-gpu/metal-vulkan"]

[dependencies]
stela-driver-audio = { path = "../stela-driver-audio" }
stela-driver-base = { path = "../stela-driver-base" }
stela-driver-core = { path = "../stela-driver-core" }
stela-driver-gpu = { path = "../stela-driver-gpu" }
stela-driver-net = { path = "../stela-driver-net" }
stela-driver-storage = { path = "../stela-driver-storage" }
# SHA-1 and SHA-256 over Bluetooth firmware images.
stela-crypto = { path = "../stela-crypto" }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[dev-dependencies]
stela-driver-base = { path = "../stela-driver-base", features = ["test-support"] }
sha2 = { version = "0.10", default-features = false }
