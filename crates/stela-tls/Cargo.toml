[package]
name="stela-tls"
version.workspace=true
edition.workspace=true
license.workspace=true
publish=false
links="stela_mbedcrypto"
[features]
# Independent hosted Ring peers need the target C toolchain/sysroot. The shared
# native all-feature test gate always runs them; production TLS uses this crate's
# checked provider regardless of whether this reference feature is enabled.
native-reference-peer = ["rustls/ring"]

[build-dependencies]
cc="1"
sha2={version="0.10",default-features=false}
[dev-dependencies]
x25519-dalek={version="=2.0.1",default-features=false,features=["static_secrets","zeroize"]}
p256={version="=0.13.2",default-features=false,features=["ecdh"]}

[dependencies]
rustls={version="=0.23.45",default-features=false,features=["custom-provider","tls12"]}
webpki-roots={version="=1.0.9",default-features=false}
# Keep the security-critical verifier at the exact qualified upstream patch.
webpki={package="rustls-webpki",version="=0.103.16",default-features=false}
aes-gcm={version="=0.11.1",default-features=false,features=["aes","alloc","zeroize"]}
aes={version="=0.9.3",default-features=false,features=["zeroize"]}
ghash={version="=0.6.0",default-features=false,features=["zeroize"]}
polyval={version="=0.7.3",default-features=false,features=["zeroize"]}
chacha20poly1305={version="=0.11.0",default-features=false,features=["alloc","zeroize"]}
poly1305={version="=0.9.1",default-features=false,features=["zeroize"]}
der={version="=0.7.10",default-features=false}

zeroize={version="=1.9.1",default-features=false,features=["alloc"]}
[target.'cfg(not(target_os="uefi"))'.dev-dependencies]
rustls={version="=0.23.45",default-features=false,features=["std","tls12"]}
getrandom={version="=0.2.17"}

[lints]
workspace=true
