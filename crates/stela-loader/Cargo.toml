[package]
name = "stela-loader"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["std"]
# Without `std` only the kernel boot-bundle builder (`boot_bundle` and the
# formats it reads) is built, for `stela.efi`.
std = [
    "anyhow/std", "stela-contracts/std", "stela-formats/std",
    "hex/std",
    "object/std",
    "serde/std",
    "serde_json/std",
    "stela-runtime/std",
    "dep:stela-compiler",
]

[dependencies]
stela-contracts = { path = "../stela-contracts", default-features = false }
stela-formats = { path = "../stela-formats", default-features = false }
stela-drivers.workspace = true
anyhow = { version = "1", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
object = { version = "0.37", default-features = false, features = ["read"] }
serde.workspace = true
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
stela-compiler = { path = "../stela-compiler", optional = true }
stela-runtime = { path = "../stela-runtime", default-features = false }

[dev-dependencies]
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
tempfile.workspace = true

[lints]
workspace = true
