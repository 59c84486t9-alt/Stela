[package]
name = "stela-loader"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["std"]
# Without `std` only the kernel boot-bundle builder (`boot_bundle` and the
# formats it reads) is built, for `stela.efi`.
std = [
    "anyhow/std",
    "hex/std",
    "object/std",
    "serde/std",
    "serde_json/std",
    "stela-runtime/std",
    "dep:sha1",
    "dep:stela-compiler",
    "dep:walkdir",
]

[dependencies]
anyhow = { version = "1", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
object = { version = "0.37", default-features = false, features = ["read"] }
serde.workspace = true
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# Code-directory hashes of SHA-1 code signatures (`code_signature`).
sha1 = { version = "0.10", default-features = false, optional = true }
sha2 = { version = "0.10", default-features = false }
stela-compiler = { path = "../stela-compiler", optional = true }
stela-runtime = { path = "../stela-runtime", default-features = false }
walkdir = { version = "2", optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
