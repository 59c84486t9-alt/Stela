[package]
name = "stela-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
native-profile = []
std = ["anyhow/std", "serde/std", "serde_json/std", "stela-compiler/std", "dep:tempfile", "dep:libc"]

[dependencies]
anyhow = { version = "1", default-features = false }
serde.workspace = true
serde_json = { version = "1", default-features = false, features = ["alloc"] }
tempfile = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
# SEP root derivations and secret lifetime; both work without std.
hmac = { version = "0.12", default-features = false }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# Stela-owned SEP system identity keys; constant-time no_std curve arithmetic.
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic"] }
# Public RSA verification for Image4 evidence; no private-key operations.
crypto-bigint = { version = "0.5", default-features = false }
# The AES engine model's cipher: constant-time, no_std, AES-NI when present.
aes = { version = "0.8", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
# Inflates deflate IPSW members in place, in no_std: no unsafe code, and the
# same inflater flate2 and the zip crate already use on the host.
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
stela-compiler = { path = "../stela-compiler", default-features = false }
stela-drivers = { path = "../stela-drivers" }
# The client network's protocols (`platform::net`): ARP, IPv4, DHCPv4,
# DNS and TCP with window scaling, reassembly and Reno (CUBIC needs std floats).
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-tcp-reno", "socket-dhcpv4", "socket-dns", "assembler-max-segment-count-32"] }
# HTTP/1.1 response heads and chunk sizes.
httparse = { version = "1.10", default-features = false }

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
# The drivers' RAM disk, which the device model tests run on.
stela-drivers = { path = "../stela-drivers", features = ["ram-disk"] }
# The reference LZFSE encoder the no_std decoder is checked against.
lzfse_rust = "0.2"
