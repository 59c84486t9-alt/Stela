[package]
name = "stela-mesa-nil"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "nil"
path = "../../../third_party/mesa/src/nouveau/nil/lib.rs"

[lints.rust]
warnings = "allow"

[dependencies]
