[package]
name = "stela-crypto"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[features]
force-software = ["sha1/force-soft", "sha2/force-soft"]

[dependencies]
sha1 = { version = "0.10", default-features = false, features = ["compress"] }
sha2 = { version = "0.10", default-features = false, features = ["compress"] }
aes = { version = "0.8", default-features = false, features = ["zeroize"] }
zeroize = { version = "1.9", default-features = false }

[target.'cfg(all(target_arch = "x86_64", not(target_os = "uefi")))'.dependencies]
cpufeatures = "0.3"

[target.'cfg(target_os = "uefi")'.dependencies]
sha1 = { version = "0.10", default-features = false, features = ["compress", "force-soft"] }
sha2 = { version = "0.10", default-features = false, features = ["compress", "force-soft"] }

[dev-dependencies]
hex = { version = "0.4", default-features = false, features = ["alloc"] }
