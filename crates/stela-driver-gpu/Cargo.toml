[package]
name = "stela-driver-gpu"
version.workspace = true
edition.workspace = true
# Original Stela code is MIT; Linux-derived ports retain their GPL notices
# and the LLVM patches keep the terms of the upstream files they change.
license = "MIT AND BSD-3-Clause AND GPL-2.0-only AND GPL-2.0-or-later AND Apache-2.0 WITH LLVM-exception"

[lints]
workspace = true

[features]
# Common native Linux kernel services; selecting this attaches no GPU.
linux-kernel = ["dep:cc", "dep:stela-c-build", "stela-c-build/linux", "dep:stela-linux", "stela-linux/kernel"]
# Build the implemented native NVIDIA OS hooks, not a complete GPU driver.
nvidia-port = ["dep:cc", "dep:stela-c-build", "stela-c-build/native"]
# Native Xe command/page-table support; not an initialized Intel GPU driver.
intel-port = ["linux-kernel"]
# nouveau's hardware resource manager (NVKM), compiled unchanged; it reaches
# no device until the kernel services it imports are supplied.
nouveau-port = ["linux-kernel", "stela-c-build/linux-registry"]
# Native AMD page-entry and BAR support; requires real mapping/GMC owners.
amd-port = ["linux-kernel"]
# Hosted AMD encoder build; its C runtime is not yet ported to UEFI.
amd-commands = ["dep:cc"]
# Stela's Metal device over the internal Vulkan boundary; no Vulkan driver.
metal = ["dep:stela-contracts"]
# The Metal device's native backend over a loaded Vulkan driver (NVK).
metal-vulkan = ["metal", "dep:ash"]
# The image links the Metal compiler's C (`crates/stela-mesa`).
metal-linked = ["metal-vulkan"]

[dependencies]
stela-linux = { path = "../stela-linux", optional = true }
stela-driver-base = { path = "../stela-driver-base" }
stela-driver-core = { path = "../stela-driver-core" }
stela-crypto = { path = "../stela-crypto" }
# The call gate contract the Metal service is entered through.
stela-contracts = { path = "../stela-contracts", default-features = false, optional = true }
# Vulkan bindings for the Metal device's native backend; no loader is linked.
ash = { version = "0.38", default-features = false, optional = true }
triomphe = { version = "=0.1.16", default-features = false }

[dev-dependencies]
stela-driver-base = { path = "../stela-driver-base", features = ["test-support"] }
sha2 = { version = "0.10", default-features = false }

[build-dependencies]
# GPU composite imports are checked against their actual archive members.
object = { version = "0.37", default-features = false, features = ["read"] }
cc = { version = "1", optional = true }
stela-c-build = { path = "../stela-c-build", optional = true }

[[test]]
name = "nvidia_mmio"
required-features = ["nvidia-port"]

[[test]]
name = "amd_native_mmio"
required-features = ["amd-port"]

[[test]]
name = "intel_activation"
required-features = ["intel-port"]
