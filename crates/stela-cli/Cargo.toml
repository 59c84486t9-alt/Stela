[package]
name = "stela-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "stela"
path = "src/main.rs"

# The native program inside each launcher bundle `stela apps` makes.
[[bin]]
name = "stela-launcher"
path = "src/bin/stela-launcher/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true
stela-compiler.workspace = true
stela-drivers = { workspace = true, features = ["ram-disk"] }
stela-runtime.workspace = true
stela-loader.workspace = true
base64 = "0.22"
getrandom = "0.2"
hpke = { version = "0.13", default-features = false, features = ["alloc", "p256"] }
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
plist = "1"
zeroize = "1"
libc.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha1 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }

# Setup's disk backend on Windows: storage and volume control codes.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }


[lints]
workspace = true
