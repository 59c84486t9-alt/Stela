[package]
name = "stela-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "stela"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true
stela-compiler.workspace = true
stela-runtime.workspace = true
stela-loader.workspace = true
base64 = "0.22"
hpke = { version = "0.13", default-features = false, features = ["alloc", "p256"] }
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
plist = "1"
zeroize = "1"
libc.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha1 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }


[lints]
workspace = true
