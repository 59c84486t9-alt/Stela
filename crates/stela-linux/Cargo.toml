[package]
name = "stela-linux"
version.workspace = true
edition.workspace = true
license = "GPL-2.0-or-later AND GPL-2.0-only AND MIT AND BSD-3-Clause"
description = "Linux kernel services for running unchanged Linux driver code"
repository.workspace = true
rust-version.workspace = true
publish = false
links = "stela_linux"

[lints]
workspace = true

[features]
# Default builds require no external Linux source.
kernel = ["dep:stela-driver-core", "dep:cc", "dep:stela-c-build", "stela-c-build/linux-registry", "stela-driver-base/linux-kernel"]

# Bounded original C execution on the hosted continuation adapter.
hosted-runtime = ["kernel", "stela-driver-base/test-support"]
# Standalone C suites and original task fixture executables.
hosted-test-support = ["hosted-runtime"]

[dependencies]
stela-driver-core = { path = "../stela-driver-core", optional = true }
stela-driver-base = { path = "../stela-driver-base" }
stela-crypto = { path = "../stela-crypto" }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[dev-dependencies]
libc = "0.2"
tempfile = "3"
stela-driver-base = { path = "../stela-driver-base", features = ["test-support"] }

[build-dependencies]
cc = { version = "1", optional = true }
stela-c-build = { path = "../stela-c-build", optional = true }
